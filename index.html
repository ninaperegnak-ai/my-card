:root {
  --bg: #050508;
  --bg-card: rgba(255, 255, 255, 0.02);
  --text: #f0f0f5;
  --muted: #8a8a9e;
  --cyan: #00FFCC;
  --purple: #A855F7;
  --gold: #E5C07B;
  --line: rgba(255, 255, 255, 0.06);
  --font-display: 'Playfair Display', serif;
  --font-sans: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg); color: var(--text); font-family: var(--font-sans);
  min-height: 100vh; overflow-x: hidden;
  background-image:

    radial-gradient(circle at 90% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
  background-attachment: fixed; line-height: 1.7;
}
#bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: 0.6; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
.shell { width: min(100% - 32px, 850px); margin: 0 auto; padding: 40px 0 60px; position: relative; z-index: 2; }

.top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
.brand { font-family: var(--font-mono); font-size: 14px; font-weight: bold; color: var(--text); letter-spacing: 1px; }
.brand span { color: var(--cyan); }
.btn-contact { 
  font-family: var(--font-mono); font-size: 13px; font-weight: bold; padding: 10px 20px;
  background: rgba(0, 255, 204, 0.1); color: var(--cyan); border: 1px solid var(--cyan);
  border-radius: 8px; text-decoration: none; transition: all 0.3s; position: relative;
  animation: borderPulse 2s infinite;
}
@keyframes borderPulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(0, 255, 204, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
}
.btn-contact:hover { background: var(--cyan); color: var(--bg); animation: none; box-shadow: 0 0 20px rgba(0, 255, 204, 0.6); }

.header { text-align: center; margin-bottom: 30px; }
.status-badge {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px;
  color: var(--cyan); background: rgba(0, 255, 204, 0.05); border: 1px solid rgba(0, 255, 204, 0.2);
  padding: 6px 14px; border-radius: 20px; margin-bottom: 20px;
}
.status-dot { width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
.header h1 { 
  font-family: var(--font-display); font-size: clamp(50px, 10vw, 80px); 
  color: var(--gold); margin-bottom: 15px; line-height: 1; cursor: default;
  position: relative; display: inline-block;
}
.header h1:hover { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; }
@keyframes glitch {
  0% { transform: translate(0); text-shadow: 0 0 40px rgba(229, 192, 123, 0.2); }
  20% { transform: translate(-2px, 2px); text-shadow: 2px 0 var(--cyan), -2px 0 var(--purple); }
  40% { transform: translate(-2px, -2px); text-shadow: -2px 0 var(--cyan), 2px 0 var(--purple); }
  60% { transform: translate(2px, 2px); text-shadow: 2px 0 var(--cyan), -2px 0 var(--purple); }
  80% { transform: translate(2px, -2px); text-shadow: -2px 0 var(--cyan), 2px 0 var(--purple); }
  100% { transform: translate(0); text-shadow: 0 0 40px rgba(229, 192, 123, 0.2); }
}
.header p { color: var(--muted); font-family: var(--font-mono); font-size: 15px; max-width: 500px; margin: 0 auto; }

.marquee-wrap {
  width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw;
  overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 12px 0; margin-bottom: 40px; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
  display: flex;
}
.marquee-content {
  display: flex; white-space: nowrap; animation: scrollLeft 25s linear infinite;
  font-family: var(--font-mono); font-size: 13px; color: var(--muted);
}
.marquee-content span { margin: 0 20px; display: flex; align-items: center; gap: 10px; }
.marquee-content span::after { content: "✦"; color: var(--cyan); font-size: 10px; }
@keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.controls { margin-bottom: 40px; display: flex; flex-direction: column; gap: 20px; }
.search-wrap { position: relative; }
.search-wrap input {
  width: 100%; padding: 18px 20px 18px 55px; font-size: 16px;
  background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px;
  color: var(--text); font-family: var(--font-sans); outline: none; transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2); backdrop-filter: blur(10px);
}
.search-wrap input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.1), 0 10px 30px rgba(0, 255, 204, 0.15); background: rgba(0, 255, 204, 0.03); }
.search-wrap svg { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; fill: var(--muted); pointer-events: none; transition: fill 0.3s; }
.search-wrap input:focus + svg { fill: var(--cyan); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-btn {
  font-family: var(--font-mono); font-size: 13px; padding: 9px 18px;
  background: var(--bg-card); color: var(--muted); border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px);
}
.filter-btn:hover { border-color: var(--purple); color: var(--text); transform: translateY(-2px); }
.filter-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); font-weight: bold; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }

.faq-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 60px; }
.faq-item {
  position: relative; background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s, opacity 0.3s;
  opacity: 0; transform: translateY(20px);
}
.faq-item.visible { opacity: 1; transform: translateY(0); }
.faq-item::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s;
  background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(0, 255, 204, 0.08), transparent 40%);
  z-index: 1;
}
.faq-item:hover::before { opacity: 1; }
.faq-item:hover { border-color: rgba(0, 255, 204, 0.3); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.faq-item.open { border-color: var(--cyan); box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); }
.faq-q {
  position: relative; z-index: 2; padding: 22px 26px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-weight: 600; font-size: 17px; user-select: none; gap: 20px; transition: color 0.3s;
}
.faq-item.open .faq-q { color: var(--cyan); }
.faq-q .icon {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 1px solid var(--line); color: var(--muted);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink: 0; font-size: 20px; font-weight: 400;
}
.faq-item.open .faq-q .icon { transform: rotate(135deg); color: var(--cyan); border-color: var(--cyan); background: rgba(0, 255, 204, 0.1); }
.faq-a { position: relative; z-index: 2; padding: 0 26px 24px; color: var(--muted); font-size: 15px; display: none; animation: fadeIn 0.4s ease; }
.faq-item.open .faq-a { display: block; }
.faq-a a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed rgba(0, 255, 204, 0.4); transition: all 0.2s; font-weight: 600; }
.faq-a a:hover { color: #fff; border-bottom-style: solid; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
.faq-a p { margin-bottom: 12px; }
.faq-a p:last-child { margin-bottom: 0; }
.faq-a ul { margin-left: 24px; margin-bottom: 12px; }
.faq-a li { margin-bottom: 8px; }
.faq-a strong { color: var(--text); font-weight: 600; }
.faq-a code { font-family: var(--font-mono); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: var(--gold); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); font-family: var(--font-mono); font-size: 15px; display: none; }
.empty::before { content: "🔍"; display: block; font-size: 40px; margin-bottom: 15px; opacity: 0.5; }

.scroll-top {
  position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
  background: var(--bg-card); border: 1px solid var(--cyan); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: var(--cyan);
  cursor: pointer; z-index: 99; opacity: 0; pointer-events: none; transition: all 0.3s;
  backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
}
.scroll-top.show { opacity: 1; pointer-events: auto; }
.scroll-top:hover { background: var(--cyan); color: var(--bg); transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0, 255, 204, 0.5); }
.scroll-top svg { width: 24px; height: 24px; fill: currentColor; }
footer { text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 25px; border-top: 1px solid var(--line); text-transform: uppercase; letter-spacing: 1.5px; }

@media (max-width: 768px) {
  .shell { width: 100%; padding: 20px 16px 40px; }
  .top-nav { margin-bottom: 30px; }
  .btn-contact { padding: 8px 14px; font-size: 12px; animation: none; }
  .header h1 { font-size: 50px; }
  .header p { font-size: 13px; }
  .marquee-content { font-size: 11px; }
  .marquee-content span { margin: 0 15px; }
  .search-wrap input { padding: 15px 15px 15px 45px; font-size: 15px; }
  .search-wrap svg { left: 15px; width: 18px; height: 18px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 8px 14px; font-size: 12px; white-space: nowrap; }
  .faq-q { padding: 18px 20px; font-size: 15px; }
  .faq-q .icon { width: 24px; height: 24px; font-size: 18px; }
  .faq-a { padding: 0 20px 20px; font-size: 14px; }
  .faq-a ul { margin-left: 20px; }
  .faq-item::before { display: none; }
  .faq-item:hover { border-color: var(--line); box-shadow: none; }
  .filter-btn:hover { transform: none; }
  .scroll-top { bottom: 20px; right: 20px; width: 44px; height: 44px; }
  .scroll-top svg { width: 20px; height: 20px; }
}

  }
];

let currentCategory = "Все";
const searchInput = document.getElementById('searchInput');
const faqList = document.getElementById('faqList');
const filtersContainer = document.getElementById('filters');
const emptyState = document.getElementById('emptyState');
const scrollTopBtn = document.getElementById('scrollTop');
const isMobile = window.matchMedia("(max-width: 768px)").matches;

const marquee = document.getElementById('marquee');
marquee.innerHTML += marquee.innerHTML;

const categories = ["Все", ...new Set(faqData.map(item => item.category))];
categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = `filter-btn ${cat === 'Все' ? 'active' : ''}`;
  btn.textContent = cat;
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = cat;
    renderFaq();
  };
  filtersContainer.appendChild(btn);
});

function renderFaq() {
  const query = searchInput.value.toLowerCase().trim();
  faqList.innerHTML = '';
  let found = 0;

  faqData.forEach((item) => {
    const matchCategory = currentCategory === "Все" || item.category === currentCategory;
    const matchQuery = item.q.toLowerCase().includes(query) || item.a.toLowerCase().includes(query);

    if (matchCategory && matchQuery) {
      found++;
      const div = document.createElement('div');
      div.className = 'faq-item';
      if (query.length > 1) div.classList.add('open');

      div.innerHTML = `
        <div class="faq-q">
          <span>${item.q}</span>
          <div class="icon">+</div>
        </div>
        <div class="faq-a">${item.a}</div>
      `;

      const qBlock = div.querySelector('.faq-q');
      qBlock.onclick = () => {
        const isOpen = div.classList.contains('open');
        document.querySelectorAll('.faq-item').forEach(el => el.classList.remove('open'));
        if (!isOpen) div.classList.add('open');
      };

      if (!isMobile) {
        div.addEventListener('mousemove', e => {
          const rect = div.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          div.style.setProperty('--mouse-x', `${x}px`);
          div.style.setProperty('--mouse-y', `${y}px`);
        });
      }

      faqList.appendChild(div);
    }
  });

  emptyState.style.display = found === 0 ? 'block' : 'none';
  setTimeout(observeElements, 50);
}

function observeElements() {
  const items = document.querySelectorAll('.faq-item');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, index) => {
      if (entry.isIntersecting) {
        setTimeout(() => {
          entry.target.classList.add('visible');
        }, index * 50);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  items.forEach(item => observer.observe(item));
}

searchInput.addEventListener('input', renderFaq);

window.addEventListener('scroll', () => {
  if (window.scrollY > 300) scrollTopBtn.classList.add('show');
  else scrollTopBtn.classList.remove('show');
});
scrollTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

// --- ЛЕТАЮЩИЕ 3D-ФИГУРЫ НА ФОНЕ ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let width, height;
let shapes = [];
const shapeCount = window.innerWidth < 768 ? 15 : 40;
const mouse = { x: -1000, y: -1000, radius: 150 };

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
resize();

class Shape {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 20 + 10;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.type = Math.floor(Math.random() * 3);
    this.color = Math.random() > 0.5 ? '0, 255, 204' : '229, 192, 123';
    this.alpha = Math.random() * 0.4 + 0.1;
  }
  
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.rotation += this.rotSpeed;

    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < mouse.radius) {
      const force = (mouse.radius - dist) / mouse.radius;
      this.x -= (dx / dist) * force * 5;
      this.y -= (dy / dist) * force * 5;
    }

    if (this.x < -this.size) this.x = width + this.size;
    if (this.x > width + this.size) this.x = -this.size;
    if (this.y < -this.size) this.y = height + this.size;
    if (this.y > height + this.size) this.y = -this.size;
  }
  
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.beginPath();
    
    const s = this.size;
    if (this.type === 0) { 
      ctx.moveTo(0, -s); ctx.lineTo(s, s); ctx.lineTo(-s, s);
    } else if (this.type === 1) { 
      ctx.rect(-s, -s, s * 2, s * 2);
    } else { 
      ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
    }
    
    ctx.closePath();
    ctx.strokeStyle = `rgba(${this.color}, ${this.alpha})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = `rgba(${this.color}, ${this.alpha * 0.15})`;
    ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < shapeCount; i++) shapes.push(new Shape());

function animate() {
  ctx.clearRect(0, 0, width, height);
  shapes.forEach(shape => {
    shape.update();
    shape.draw();
  });
  requestAnimationFrame(animate);
}
animate();

renderFaq();
</script>
</body>
</html>
